            contextWindow: 262144
            maxTokens: 131072
            input: [text, image]
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (Agent Plan)
            contextWindow: 1048576
            maxTokens: 393216
            input: [text, image]
          - id: deepseek-v4.1-flash-economy

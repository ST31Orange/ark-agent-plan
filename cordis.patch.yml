# ============================================================================
# ark-agent-plan 鈥?DeepSeek Harness bundle patch
#
# Registers Volcengine Ark provider routes on the shared pi-ai adapter
# (`@deepseek-ai/dsh-llm-pi-ai`, mounted dormant by dsh-base). Because these
# providers are supplied here as the settings *base* layer, they show up in the
# native model picker the moment this bundle is composed 鈥?the user only has to
# add an API key (the web Models page writes it to the credential name each
# route references via `apiKeyEnv`).
#
# This bundle owns the whole `llm-pi-ai` provider set: a `config` patch replaces
# the targeted row wholesale, and a later bundle layer wins, so all five routes
# are declared here in full. The Agent Plan catalog below was refreshed and
# verified against the live endpoint; the Coding Plan and postpaid catalogs were
# not re-probed and keep their previously published entries.
#
# Agent Plan catalog, verified 2026-11-21 against
# https://ark.cn-beijing.volces.com/api/plan/v1/messages: every id below accepts
# a Messages API request, deep thinking, and tool use; image input was probed
# per model. contextWindow / maxTokens follow the Ark model-list documentation
# and the endpoint's own max_tokens validation.
#
# Default wire protocol is `anthropic-messages` (the Messages API). pi-ai hands
# `baseURL` straight to the Anthropic SDK, which appends `/v1/messages`, so the
# base URLs below intentionally omit the `/v1` suffix.
# ============================================================================

- insert:
    - id: ark-agent-plan
      name: ark-agent-plan

- id: llm-pi-ai
  config:
    providers:

      # --- Agent Plan (cn-beijing) -----------------------------------------
      ark-agent-plan-cn:
        displayName: Ark Agent Plan
        apiKeyEnv: ARK_AGENT_PLAN_CN_API_KEY
        api: anthropic-messages
        baseURL: https://ark.cn-beijing.volces.com/api/plan
        models:
          - id: doubao-seed-2.1-pro
            name: Doubao Seed 2.1 Pro (Agent Plan)
            contextWindow: 1048576
            maxTokens: 262144
            input: [text, image]
          - id: doubao-seed-evolving
            name: Doubao Seed Evolving (Agent Plan)
            contextWindow: 1048576
            maxTokens: 262144
            input: [text, image]
          - id: doubao-seed-2.1-lite
            name: Doubao Seed 2.1 Lite (Agent Plan)
            contextWindow: 1048576
            maxTokens: 262144
            input: [text, image]
          - id: doubao-seed-2.0-mini
